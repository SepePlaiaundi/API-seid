<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login Personalizado</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .login-container { border: 1px solid #ccc; padding: 20px; border-radius: 5px; width: 300px; }
        .error { color: red; margin-bottom: 10px; }
        .msg { color: green; margin-bottom: 10px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Iniciar Sesión</h2>

    <div th:if="${param.error}" class="error">
        Usuario o contraseña incorrectos.
    </div>

    <div th:if="${param.logout}" class="msg">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/perform_login}" method="post">
        
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" placeholder="admin" required autofocus/>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="1234" required/>

        <button type="submit">Entrar</button>
    </form>
</div>

</body>
</html>
