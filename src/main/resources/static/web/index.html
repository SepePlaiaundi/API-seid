<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Cámaras de Tráfico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-blue-600 text-white p-6 shadow-md">
        <h1 class="text-3xl font-bold text-center">Panel de Revisión de Cámaras</h1>
        <p class="text-center mt-2 opacity-90" id="status">Cargando cámaras...</p>
    </header>

    <main id="camera-grid" class="grid-container">
        </main>

    <script>
        const API_URL = 'http://localhost:8080/camara';

        async function fetchCameras() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error al conectar con el servidor');
                
                const data = await response.json();
                renderCameras(data);
                
                document.getElementById('status').innerText = `Total: ${data.length} cámaras encontradas`;
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = 'Error: No se pudo cargar la información de localhost:8080';
                document.getElementById('status').classList.add('text-red-200');
            }
        }

        function renderCameras(cameras) {
            const container = document.getElementById('camera-grid');
            container.innerHTML = ''; // Limpiar contenedor

            cameras.forEach(cam => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200 hover:shadow-2xl transition-shadow duration-300";

                card.innerHTML = `
                    <div class="relative">
                        <img src="${cam.urlImage}" alt="${cam.nombre}" class="w-full h-48 object-cover bg-gray-200" onerror="this.src='https://via.placeholder.com/400x250?text=Imagen+no+disponible'">
                        ${cam.new ? '<span class="absolute top-2 right-2 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded">NUEVA</span>' : ''}
                    </div>
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h2 class="text-xl font-bold text-gray-800 leading-tight">${cam.nombre}</h2>
                            <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">${cam.carretera}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-4 italic">${cam.direccion}</p>
                        
                        <div class="space-y-2 text-sm text-gray-700">
                            <div class="flex justify-between border-b pb-1">
                                <span class="font-semibold">Kilómetro:</span>
                                <span>${cam.kilometro}</span>
                            </div>
                            <div class="flex justify-between border-b pb-1">
                                <span class="font-semibold">Recurso:</span>
                                <span>${cam.recurso.descEs}</span>
                            </div>
                            <div class="flex justify-between border-b pb-1">
                                <span class="font-semibold">Coordenadas:</span>
                                <span>${cam.latitud.toFixed(4)}, ${cam.longitud.toFixed(4)}</span>
                            </div>
                        </div>

                        <div class="mt-4 pt-2 text-[10px] text-gray-400 flex justify-between">
                            <span>ID: ${cam.id}</span>
                            <span>Act: ${new Date(cam.ultimaActualizacion).toLocaleString()}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Ejecutar al cargar la página
        fetchCameras();
    </script>
</body>
</html>
