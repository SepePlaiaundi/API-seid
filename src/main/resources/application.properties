spring.application.name=seid

# --- Configuracion MySQL ---
spring.datasource.url=jdbc:mysql://:/seid
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuracion JPA / Hibernate ---
# 'update': Crea las tablas si no existen o las actualiza. 
# Úsalo en DEV. En PROD usa 'validate'.
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (útil para depurar)
spring.jpa.show-sql=true